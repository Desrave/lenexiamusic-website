<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LENEXIA — Latin · Tribal · House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        :root {
            --purple: #7B42FF;
            --purple-glow: rgba(123,66,255,.5);
            --bg: #07080f;
            --surface: rgba(255,255,255,.06);
            --border: rgba(255,255,255,.09);
            --text: #ffffff;
            --muted: rgba(255,255,255,.5);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        /* ── SWITCHER ── */
        .switcher {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 16px;
            background: rgba(7,8,15,.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .switcher a {
            color: rgba(255,255,255,.5);
            font-size: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,.12);
            transition: all .2s;
            white-space: nowrap;
        }

        .switcher a.active { background: var(--purple); border-color: var(--purple); color: #fff; }
        .switcher a:not(.active):hover { border-color: rgba(255,255,255,.35); color: #fff; }

        /* ── HERO ── */
        .hero {
            position: relative;
            height: 100dvh;
            height: 100vh; /* fallback */
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero video {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(7,8,15,.15)  0%,
                rgba(7,8,15,.4)   55%,
                rgba(7,8,15,1)   100%
            );
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: -60px;
        }

        .hero-logo {
            width: 240px;
            max-width: 68vw;
            filter: drop-shadow(0 0 36px var(--purple-glow));
        }

        .hero-tagline {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: .45em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .hero-cta {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: var(--purple);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .04em;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 100px;
            box-shadow: 0 0 40px var(--purple-glow);
            transition: transform .15s, box-shadow .2s;
            -webkit-tap-highlight-color: transparent;
        }

        .hero-cta:active { transform: scale(.96); }

        .hero-scroll {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            color: var(--muted);
            animation: bob 2.4s ease-in-out infinite;
        }

        @keyframes bob {
            0%,100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(9px); }
        }

        /* ── SECTIONS ── */
        .section {
            padding: 56px 24px;
            max-width: 480px;
            margin: 0 auto;
        }

        .section-label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .44em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
            margin-bottom: 28px;
        }

        /* ── FOLLOW BUTTONS ── */
        .follow-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .platform-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            transition: transform .15s;
            -webkit-tap-highlight-color: transparent;
        }

        .platform-btn:active { transform: scale(.97); }

        .platform-btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .platform-btn i.fab { font-size: 19px; width: 22px; text-align: center; }
        .platform-btn .btn-arrow { opacity: .55; font-size: 13px; }

        .btn-ig  { background: linear-gradient(135deg, #405de6, #833ab4, #e1306c, #f77737); }
        .btn-tt  { background: #111; border: 1px solid rgba(255,255,255,.12); }
        .btn-yt  { background: #FF0000; }
        .btn-sc  { background: linear-gradient(135deg, #FF6600, #FF3300); }

        /* ── SC PLAYER ── */
        .player-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            padding: 4px;
        }

        .player-card iframe { display: block; border-radius: 16px; }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 20px 24px 48px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .06em;
        }
    </style>
</head>
<body>

<nav class="switcher">
    <a href="index.html">← Studies</a>
    <a href="style-1.html" class="active">① Dark Pulse</a>
    <a href="style-2.html">② Latin Fire</a>

</nav>

</div>

                <i class="fab fa-instagram"></i>

        </a>

        <a href="https://youtube.com/@lenexiamusic" target="_blank" rel="noopener" class="platform-btn btn-yt">
            <span class="platform-btn-left">
                <i class="fab fa-youtube"></i>

        <a href="https://soundcloud.com/lenexiamusic" target="_blank" rel="noopener" class="platform-btn btn-sc">
            <span class="platform-btn-left">

                <span>Volg op SoundCloud</span>

    </div>

<!-- SC PLAYER -->
<section class="section" id="listen" style="padding-top:0;">
    <span class="section-label">Nu luisteren</span>
    <div class="player-card">
        <iframe
            width="100%" height="300"

<footer>© 2025 LENEXIA &mdash; Latin · Tribal · House</footer>

</body>
</html>
