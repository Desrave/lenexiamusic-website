<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LENEXIA — Latin · Tribal · House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --pink:   #FF0080;
            --pink-g: rgba(255,0,128,.22);
            --mint:   #00FFD1;
            --bg:     #000000;
            --text:   #ffffff;
            --muted:  rgba(255,255,255,.4);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* subtle scanline overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(255,255,255,.013) 3px,
                rgba(255,255,255,.013) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── SWITCHER ── */
        .switcher {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 16px;
            background: rgba(0,0,0,.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,0,128,.18);
        }

        .switcher a {
            color: var(--muted);
            font-size: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255,0,128,.2);
            transition: all .2s;
            white-space: nowrap;
        }

        .switcher a.active { background: var(--pink); border-color: var(--pink); color: #fff; }
        .switcher a:not(.active):hover { border-color: var(--pink); color: var(--pink); }

        /* ── HEADER ── */
        .header {
            padding: 104px 32px 40px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .header-logo {
            width: 270px;
            max-width: 78vw;
            filter: drop-shadow(0 0 24px var(--pink-g));
        }

        .header-tagline {
            margin-top: 18px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .55em;
            text-transform: uppercase;
            color: var(--pink);
            text-shadow: 0 0 24px rgba(255,0,128,.55);
        }

        /* ── VIDEO FRAME ── */
        .video-section {
            padding: 8px 20px 56px;
            max-width: 540px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .video-frame {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--pink);
            box-shadow:
                0 0 0 1px rgba(255,0,128,.15),
                0 0 24px rgba(255,0,128,.25),
                0 0 80px rgba(255,0,128,.1);
        }

        .video-frame video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        /* neon corner accents */
        .video-frame::before,
        .video-frame::after {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            z-index: 2;
            pointer-events: none;
        }

        .video-frame::before {
            top: -1px; left: -1px;
            border-top: 2px solid var(--mint);
            border-left: 2px solid var(--mint);
            border-radius: 10px 0 0 0;
        }

        .video-frame::after {
            bottom: -1px; right: -1px;
            border-bottom: 2px solid var(--mint);
            border-right: 2px solid var(--mint);
            border-radius: 0 0 10px 0;
        }

        /* ── LABEL ── */
        .label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .46em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: center;
            margin-bottom: 28px;
        }

        /* ── SOCIAL GRID ── */
        .social-section {
            padding: 0 24px 56px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .social-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 22px 8px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,0,128,.2);
            transition: background .2s, border-color .2s, box-shadow .2s, transform .15s;
            -webkit-tap-highlight-color: transparent;
        }

        .social-btn:hover {
            background: rgba(255,0,128,.08);
            border-color: var(--pink);
            box-shadow: 0 0 22px rgba(255,0,128,.2);
            transform: translateY(-3px);
        }

        .social-btn:active { transform: scale(.96); }

        .social-btn i     { font-size: 26px; }
        .social-btn span  { font-size: 9px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

        .btn-ig i { color: #e1306c; }
        .btn-tt i { color: #fff; }
        .btn-yt i { color: #FF0000; }
        .btn-sc i { color: #FF5500; }

        /* ── SC PLAYER ── */
        .player-section {
            padding: 0 20px 56px;
            max-width: 540px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .player-card {
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,0,128,.25);
            box-shadow: 0 0 32px rgba(255,0,128,.1);
        }

        .player-card iframe { display: block; }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 20px 24px 56px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: .08em;
            position: relative;
            z-index: 1;
        }

        .dot {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--pink);
            box-shadow: 0 0 8px var(--pink);
            vertical-align: middle;
            margin: 0 10px;
        }
    </style>
</head>
<body>

<nav class="switcher">
    <a href="index.html">← Studies</a>
    <a href="style-1.html">① Dark Pulse</a>
    <a href="style-2.html">② Latin Fire</a>
    <a href="style-3.html" class="active">③ Neon Edge</a>
</nav>

<!-- HEADER -->
<header class="header">
    <img class="header-logo" src="../supplied/LENEXIA-White-Alpha.png" alt="LENEXIA">
    <p class="header-tagline">Latin &middot; Tribal &middot; House</p>
</header>

<!-- VIDEO IN FRAME -->
<section class="video-section">
    <div class="video-frame">
        <video autoplay muted loop playsinline>
            <source src="../supplied/LENEXIA_Promo_Landscape.mp4" type="video/mp4">
        </video>
    </div>
</section>

<!-- SOCIAL ICONS -->
<section class="social-section" id="follow">
    <span class="label">Volg LENEXIA</span>
    <div class="social-grid">

        <a href="https://instagram.com/lenexiamusic" target="_blank" rel="noopener" class="social-btn btn-ig">
            <i class="fab fa-instagram"></i>
            <span>Insta</span>
        </a>

        <a href="https://tiktok.com/@lenexiamusic" target="_blank" rel="noopener" class="social-btn btn-tt">
            <i class="fab fa-tiktok"></i>
            <span>TikTok</span>
        </a>

        <a href="https://youtube.com/@lenexiamusic" target="_blank" rel="noopener" class="social-btn btn-yt">
            <i class="fab fa-youtube"></i>
            <span>YouTube</span>
        </a>

        <a href="https://soundcloud.com/lenexiamusic" target="_blank" rel="noopener" class="social-btn btn-sc">
            <i class="fab fa-soundcloud"></i>
            <span>Cloud</span>
        </a>

    </div>
</section>

<!-- SC PLAYER -->
<section class="player-section" id="listen">
    <span class="label">Nu luisteren</span>
    <div class="player-card">
        <iframe
            width="100%" height="300"
            scrolling="no" frameborder="no" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/lenexiamusic&color=%23FF0080&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=true">
        </iframe>
    </div>
</section>

<footer>
    <span class="dot"></span>LENEXIA © 2025<span class="dot"></span>
</footer>

</body>
</html>
